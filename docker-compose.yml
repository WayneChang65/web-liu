services:
  liu-web:
    image: wayne/liu-web:0.4.0
    hostname: liu-web
    restart: unless-stopped
    container_name: liu-web
    env_file: .env
    stdin_open: true
    tty: true
    build:
      context: .
      dockerfile: Dockerfile-web

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.liu-web.entrypoints=websecure"
      - "traefik.http.routers.liu-web.rule=Host(`liu.$MY_DOMAIN`)"
      - "traefik.http.routers.liu-web.tls.certresolver=lets-encr"
      - "traefik.http.routers.liu-web.middlewares=authelia@docker"
      # 本容器掛了兩個 service（liu-web/liu-hackmd），Docker provider 無法自動
      # 猜 router 要連哪個 → 報 "cannot be linked automatically with multiple
      # Services"，必須兩個 router 都明示綁定（2026-09-22 o1 實測）。
      - "traefik.http.routers.liu-web.service=liu-web"
      # M6: httpd now runs as non-root on 8088 (see Dockerfile)
      - "traefik.http.services.liu-web.loadBalancer.server.port=8088"

      # ---- liu-hackmd-api: /api/hackmd/* 直轉 api.hackmd.io (D9/D11) ----
      # 較長前綴 rule 優先於 liu-web 的 Host-only rule。前端只寫
      # /api/hackmd/notes...；replacepathregex 換成上游的 /v1/notes...。
      # （單用 stripprefix 會剝成 /notes 少一層 /v1 → 404，故用 replacepathregex）
      - "traefik.http.routers.liu-hackmd.entrypoints=websecure"
      - "traefik.http.routers.liu-hackmd.rule=Host(`liu.$MY_DOMAIN`) && PathPrefix(`/api/hackmd`)"
      - "traefik.http.routers.liu-hackmd.tls.certresolver=lets-encr"
      - "traefik.http.routers.liu-hackmd.middlewares=authelia@docker,liu-hackmd-path"
      - "traefik.http.routers.liu-hackmd.service=liu-hackmd"
      - "traefik.http.middlewares.liu-hackmd-path.replacepathregex.regex=^/api/hackmd(/.*)?$$"
      - "traefik.http.middlewares.liu-hackmd-path.replacepathregex.replacement=/v1$$1"
      # 外部上游（Traefik v3 合法寫法；Host header 以 server.url 為準）
      - "traefik.http.services.liu-hackmd.loadbalancer.server.url=https://api.hackmd.io"
      # （2026-09-22 o1 實測：felixbuenemann fork 對 maxbodysize 報
      #  field not found → 整組 router label 解析失敗，已依手冊刪除。
      #  body 大小改由 HackMD 端與 Authelia 端自然限縮，不再於此限制。）

#   ports:
#     - 8084:8088

# D9 (2026-09-22): the former liu-proxy sidecar (proxy/server.js +
# Dockerfile-proxy) is retired — the same-origin /api/hackmd/* requests are
# forwarded to https://api.hackmd.io/v1/* directly by Traefik via the labels
# above. `docker compose up -d` will remove the old container as expected.

networks:
  default:
    external: true
    name: $DEFAULT_NETWORK
