<!doctype html>
<html lang="zh-Hant">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>線上嘸蝦米編輯器(小青網蝦)</title>
        <!-- H3: second line of defense against stored XSS — scripts only from self -->
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
        />
        <link rel="icon" type="image/x-icon" href="/img/favicon.ico" />
        <link
            rel="icon"
            type="image/png"
            sizes="512x512"
            href="/img/favicon.png"
        />
        <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
    </head>
    <body>
        <div id="logo-container">
            <img src="/img/favicon.png" alt="Logo" />
            <span class="version-text">v0.3.0</span>
        </div>
        <div id="top-button-container">
            <button id="top-button-toggle">&#9776;</button>
            <button id="save-temp-button">存入暫存</button>
            <button id="restore-button">讀回暫存</button>
            <button id="hackmd-button">存入HackMD</button>
            <a href="description.html" id="description-button">功能說明</a>
            <button id="immersive-toggle-button">沉浸模式</button>
            <button id="theme-toggle-button">切換深色模式</button>
        </div>
        <div class="container">
            <h1>
                <span class="title-full">線上嘸蝦米編輯器(小青網蝦)</span>
                <span class="title-short">小青網蝦</span>
            </h1>
            <p class="subtitle">在下方區域直接打字，使用嘸蝦米輸入法規則。</p>
            <div class="mode-line">
                <div id="editor-tabs">
                    <button class="tab-button active" data-editor="1">1</button>
                    <button class="tab-button" data-editor="2">2</button>
                    <button class="tab-button" data-editor="3">3</button>
                </div>
                <div
                    id="mode-indicator"
                    role="button"
                    tabindex="0"
                    aria-label="輸入法模式"
                >
                    <span id="mode-text" class="mode-text boshiamy"
                        >嘸蝦米模式</span
                    >
                    (Ctrl+p 切換)<span
                        id="font-size-indicator"
                        class="font-size-indicator"
                        >, 字型大小：12</span
                    >
                </div>
            </div>
            <div id="ime-container">
                <div
                    id="main-editor"
                    contenteditable="true"
                    role="textbox"
                    aria-multiline="true"
                    aria-label="嘸蝦米編輯區"
                    placeholder="開始打字..."
                    data-empty=""
                ></div>
                <div id="ime-bar" aria-live="polite">
                    <span id="input-buffer"></span>
                    <span id="candidate-list"></span>
                </div>
            </div>
            <div class="button-container">
                <span id="button-toggle">...</span>
                <button id="copy-button">複製</button>
                <button id="save-md-button">匯出</button>
                <button id="zoom-in-button">放大</button>
                <button id="zoom-out-button">縮小</button>
            </div>
        </div>
        <footer>© 2025 Wayne Chang (w/ Gemini CLI)</footer>
        <dialog id="hackmd-modal" aria-labelledby="hackmd-modal-title">
            <h2 id="hackmd-modal-title">存入 HackMD</h2>
            <form id="hackmd-form" method="dialog">
                <label for="hackmd-token"
                    >HackMD API Token<a
                        href="https://hackmd.io/@docs/how-to-issue-an-api-token"
                        target="_blank"
                        rel="noopener"
                        >（如何取得）</a
                    ></label
                >
                <input
                    type="password"
                    id="hackmd-token"
                    autocomplete="off"
                    placeholder="貼上你的 API Token"
                />
                <label for="hackmd-title">標題（必填）</label>
                <input
                    type="text"
                    id="hackmd-title"
                    required
                    placeholder="文件標題"
                />
                <label for="hackmd-description">描述（選填）</label>
                <input
                    type="text"
                    id="hackmd-description"
                    placeholder="會放在內容最前面"
                />
                <div class="hackmd-row">
                    <div>
                        <label for="hackmd-permission">權限</label>
                        <select id="hackmd-permission">
                            <option value="private">private（私有）</option>
                            <option value="public">public（公開）</option>
                            <option value="team">team（團隊）</option>
                        </select>
                    </div>
                    <div>
                        <label for="hackmd-permalink"
                            >自有代稱（選填）</label
                        >
                        <input
                            type="text"
                            id="hackmd-permalink"
                            pattern="[A-Za-z0-9_-]{3,100}"
                            title="僅限英文、數字、底線與連字號，3-100 字"
                            placeholder="my-note-id"
                        />
                    </div>
                </div>
                <label for="hackmd-note">內容預覽（Markdown，可微調）</label>
                <textarea id="hackmd-note" rows="8" spellcheck="false"></textarea>
                <label class="hackmd-remember"
                    ><input type="checkbox" id="hackmd-remember" checked />
                    在本機記住 Token 與設定</label
                >
                <div class="hackmd-buttons">
                    <button type="button" id="hackmd-save-settings">
                        儲存設定
                    </button>
                    <button type="submit" id="hackmd-submit">存入</button>
                    <button type="button" id="hackmd-cancel">取消</button>
                </div>
            </form>
        </dialog>
        <div id="toast" role="status"></div>
        <script type="module" src="/src/main.js"></script>
    </body>
</html>
