<!doctype html>
<html lang="zh-Hant">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>線上嘸蝦米編輯器(小青網蝦)</title>
        <!-- H3: second line of defense against stored XSS — scripts only from self -->
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
        />
        <link rel="icon" type="image/x-icon" href="/img/favicon.ico" />
        <link
            rel="icon"
            type="image/png"
            sizes="512x512"
            href="/img/favicon.png"
        />
        <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
    </head>
    <body>
        <div id="logo-container">
            <img src="/img/favicon.png" alt="Logo" />
            <span class="version-text">v1.1.0</span>
        </div>
        <div id="top-button-container">
            <button id="top-button-toggle">&#9776;</button>
            <button id="hackmd-open-button">開啟HackMD</button>
            <button id="hackmd-save-button">存入HackMD</button>
            <a href="description.html" id="description-button">功能說明</a>
            <button id="immersive-toggle-button">沉浸模式</button>
            <button id="theme-toggle-button">切換深色模式</button>
        </div>
        <div class="container">
            <h1>
                <span class="title-full">線上嘸蝦米編輯器(小青網蝦)</span>
                <span class="title-short">小青網蝦</span>
            </h1>
            <p class="subtitle">在下方區域直接打字，使用嘸蝦米輸入法規則。</p>
            <div class="mode-line">
                <div id="editor-tabs">
                    <button class="tab-button active" data-editor="1">1</button>
                    <button class="tab-button" data-editor="2">2</button>
                    <button class="tab-button" data-editor="3">3</button>
                </div>
                <div
                    id="mode-indicator"
                    role="button"
                    tabindex="0"
                    aria-label="輸入法模式"
                >
                    <span id="mode-text" class="mode-text boshiamy"
                        >嘸蝦米模式</span
                    >
                    (Ctrl+p 切換)<span
                        id="font-size-indicator"
                        class="font-size-indicator"
                        >, 字型大小：12</span
                    >
                </div>
                <span
                    id="view-mode-pill"
                    class="view-pill"
                    role="button"
                    tabindex="0"
                    title="Ctrl+Shift+M 切換編輯／預覽"
                    >編輯</span
                >
            </div>
            <div id="ime-container">
                <div id="editor-cm" aria-label="嘸蝦米 Markdown 編輯區"></div>
                <div id="preview-pane" hidden aria-label="Markdown 預覽"></div>
                <div id="ime-bar" aria-live="polite">
                    <span id="input-buffer"></span>
                    <span id="candidate-list"></span>
                </div>
            </div>
            <div class="button-container">
                <span id="button-toggle">...</span>
                <button id="copy-button">複製</button>
                <button id="save-md-button">匯出</button>
                <button id="zoom-in-button">放大</button>
                <button id="zoom-out-button">縮小</button>
            </div>
        </div>
        <footer>© 2025 Wayne Chang (w/ Gemini CLI)</footer>
        <dialog id="hackmd-browser-modal" aria-labelledby="hackmd-browser-title">
            <h2 id="hackmd-browser-title">開啟 HackMD</h2>
            <div id="hackmd-browser-token-row">
                <label for="hackmd-browser-token"
                    >HackMD API Token<a
                        href="https://hackmd.io/@docs/how-to-issue-an-api-token"
                        target="_blank"
                        rel="noopener"
                        >（如何取得）</a
                    ></label
                >
                <div class="hackmd-token-line">
                    <input
                        type="password"
                        id="hackmd-browser-token"
                        autocomplete="off"
                        placeholder="貼上你的 API Token"
                    />
                    <button type="button" id="hackmd-browser-save-token">
                        儲存
                    </button>
                </div>
                <label class="hackmd-remember"
                    ><input
                        type="checkbox"
                        id="hackmd-browser-remember"
                        checked
                    />
                    在本機記住 Token</label
                >
            </div>
            <div class="hackmd-browser-toolbar">
                <input
                    type="search"
                    id="hackmd-browser-search"
                    placeholder="搜尋標題…"
                    aria-label="搜尋筆記標題"
                />
                <button type="button" id="hackmd-browser-refresh">
                    重新整理
                </button>
            </div>
            <div
                id="hackmd-browser-list"
                role="list"
                aria-label="筆記清單"
            ></div>
            <p id="hackmd-browser-status" role="status"></p>
            <div class="hackmd-buttons">
                <button type="button" id="hackmd-browser-cancel">關閉</button>
            </div>
        </dialog>
        <dialog id="hackmd-save-modal" aria-labelledby="hackmd-save-heading">
            <h2 id="hackmd-save-heading">存入 HackMD</h2>
            <p id="hackmd-save-bound-note"></p>
            <form id="hackmd-save-form" method="dialog">
                <div id="hackmd-save-title-row">
                    <label for="hackmd-save-title">標題（必填）</label>
                    <input
                        type="text"
                        id="hackmd-save-title"
                        placeholder="文件標題"
                    />
                </div>
                <label for="hackmd-save-token">HackMD API Token</label>
                <div class="hackmd-token-line">
                    <input
                        type="password"
                        id="hackmd-save-token"
                        autocomplete="off"
                        placeholder="貼上你的 API Token"
                    />
                    <button type="button" id="hackmd-save-settings">
                        儲存設定
                    </button>
                </div>
                <label class="hackmd-remember"
                    ><input type="checkbox" id="hackmd-save-remember" checked />
                    在本機記住 Token</label
                >
                <label for="hackmd-save-note"
                    >內容（Markdown，可微調）</label
                >
                <textarea
                    id="hackmd-save-note"
                    rows="8"
                    spellcheck="false"
                ></textarea>
                <div class="hackmd-buttons">
                    <button type="submit" id="hackmd-save-submit">存入</button>
                    <button type="button" id="hackmd-save-cancel">
                        取消
                    </button>
                </div>
            </form>
        </dialog>
        <div id="toast" role="status"></div>
        <script type="module" src="/src/main.js"></script>
    </body>
</html>
